version: 1

indices:
  articles:
    include:
      - '/us/en/magazine/**'
      - '/us/en/adventures/**'
    exclude:
      - '/us/en/magazine'
      - '/us/en/adventures'
    target: /us/en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
